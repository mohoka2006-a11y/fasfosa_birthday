<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>hanoon Birthday</title>
    <link rel="stylesheet" href="style.css" />

<body>
    <div class="page page-1 active">
        <div class="hero-card">

            </div>

        <div class="confetti-container"></div>

                <button class="primary-btn" data-next="3">next</button>

        <div class="balloon-container"></div>
        <div class="confetti-container"></div>
        <div class="sparkle-layer"></div>

            <h2> 😜🩵</h2>
            <div class="memory-photo"><img src="img1.jpeg" alt="Memory 1"></div>

            <div class="book-nav">

                <span class="page-label">1 / 6</span>
                <button class="primary-btn" data-next="4">next →</button>
            </div>
        </div>
        <div class="balloon-container"></div>
        <div class="confetti-container"></div>

                    <div class="ribbon vertical"></div>

                </div>
